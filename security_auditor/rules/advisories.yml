# Embedded vulnerability advisory database (curated subset).
# Used when pip-audit/safety are not available (offline / air-gapped audits).
# Each entry: affected version ranges [introduced, fixed) and fixed version.
# Keep this file updated; ranges follow PEP 440 semantics.
advisories:
  django:
    - id: CVE-2024-45230
      severity: High
      summary: "Django: potential denial-of-service in django.utils.html.urlize()"
      introduced: "4.0"
      fixed: "4.2.15"
    - id: CVE-2024-24680
      severity: High
      summary: "Django: potential denial-of-service in intcomma template filter"
      introduced: "4.0"
      fixed: "4.2.10"
    - id: CVE-2023-36053
      severity: Medium
      summary: "Django: potential ReDoS in EmailValidator/URLValidator"
      introduced: "3.2"
      fixed: "3.2.20"
    - id: CVE-2022-28346
      severity: Critical
      summary: "Django: SQL injection via QuerySet.explain(**options) on PostgreSQL"
      introduced: "2.2"
      fixed: "2.2.28"
    - id: CVE-2021-35042
      severity: Critical
      summary: "Django: SQL injection via unsanitized QuerySet.order_by() input"
      introduced: "2.2"
      fixed: "2.2.24"
    - id: CVE-2019-14232
      severity: High
      summary: "Django: denial-of-service in django.utils.text.Truncator.words()"
      introduced: "1.11"
      fixed: "1.11.23"
  djangorestframework:
    - id: CVE-2018-25045
      severity: Medium
      summary: "DRF: bypass of CBV permission checks when custom get_permissions is used"
      introduced: "3.0"
      fixed: "3.9.1"
  pillow:
    - id: CVE-2023-50447
      severity: Critical
      summary: "Pillow: arbitrary code execution via PIL.ImageMath.eval environment parameter"
      introduced: "0"
      fixed: "10.2.0"
    - id: CVE-2022-22817
      severity: Critical
      summary: "Pillow: PIL.ImageMath.eval allows arbitrary expression evaluation"
      introduced: "0"
      fixed: "9.0.0"
  requests:
    - id: CVE-2023-32681
      severity: Medium
      summary: "requests: unintended leakage of Proxy-Authorization header to destination servers"
      introduced: "2.3.0"
      fixed: "2.31.0"
  urllib3:
    - id: CVE-2023-45803
      severity: Medium
      summary: "urllib3: request body not stripped on cross-origin redirect"
      introduced: "1.26.0"
      fixed: "1.26.18"
    - id: CVE-2023-43804
      severity: Medium
      summary: "urllib3: Cookie header leakage on cross-origin redirect"
      introduced: "1.26.0"
      fixed: "1.26.17"
  pyyaml:
    - id: CVE-2020-14343
      severity: Critical
      summary: "PyYAML: arbitrary code execution via untrusted YAML (full_load bypass)"
      introduced: "0"
      fixed: "5.4"
  jinja2:
    - id: CVE-2024-34064
      severity: Medium
      summary: "Jinja2: xmlattr filter XSS via keys with spaces"
      introduced: "0"
      fixed: "3.1.4"
  cryptography:
    - id: CVE-2023-49083
      severity: High
      summary: "cryptography: NULL dereference when loading PKCS7 certificates"
      introduced: "1.0"
      fixed: "41.0.6"
  paramiko:
    - id: CVE-2023-48795
      severity: Medium
      summary: "Paramiko: Terrapin prefix-truncation attack on SSH channel"
      introduced: "0"
      fixed: "3.4.0"
  celery:
    - id: CVE-2023-32758
      severity: Medium
      summary: "Celery: Redis broker credentials exposed via task introspection"
      introduced: "5.0"
      fixed: "5.2.2"
  lxml:
    - id: CVE-2022-2309
      severity: Medium
      summary: "lxml: NULL pointer dereference in iterwalk"
      introduced: "0"
      fixed: "4.9.1"
  sqlparse:
    - id: CVE-2024-4340
      severity: Medium
      summary: "sqlparse: ReDoS via malicious SQL (also affects Django extras)"
      introduced: "0"
      fixed: "0.5.0"
  certifi:
    - id: CVE-2023-37920
      severity: High
      summary: "certifi: removal of e-Tugra root certificate after compromise concerns"
      introduced: "2015.04.28"
      fixed: "2023.7.22"
  oauthlib:
    - id: CVE-2022-36087
      severity: High
      summary: "OAuthlib: request-uri validation bypass allows open redirect"
      introduced: "0"
      fixed: "3.2.1"
  setuptools:
    - id: CVE-2024-6345
      severity: High
      summary: "setuptools: remote code execution via package_index download_index"
      introduced: "0"
      fixed: "70.0.0"
