<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; connect-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; form-action 'self'; base-uri 'none'">
  <meta name="robots" content="noindex, nofollow">
  <title>Création de compte client</title>
  <style>
    :root { font: 16px/1.5 system-ui, sans-serif; color: #162437; background: #f1f5f9; }
    * { box-sizing: border-box; }
    main { max-width: 45rem; margin: 2.5rem auto; padding: 0 1rem; }
    h1 { font-size: clamp(1.65rem, 5vw, 2.2rem); line-height: 1.2; margin: .5rem 0; }
    p { margin: .5rem 0; }
    .card { margin-top: 1.25rem; padding: clamp(1rem, 4vw, 1.75rem); border: 1px solid #d4dfeb; border-radius: .9rem; background: #fff; }
    .fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; }
    .wide { grid-column: 1 / -1; }
    label { display: block; margin-bottom: .25rem; font-weight: 650; }
    input, select, button { font: inherit; }
    input, select { width: 100%; min-height: 2.75rem; padding: .5rem .65rem; border: 1px solid #8697ab; border-radius: .45rem; color: inherit; background: #fff; }
    input[aria-invalid="true"] { border-color: #a71927; }
    :focus-visible { outline: 3px solid #1765cf; outline-offset: 2px; }
    button { margin-top: 1.25rem; padding: .65rem 1rem; border: 0; border-radius: .45rem; background: #16498c; color: #fff; cursor: pointer; font-weight: 700; }
    button:hover { background: #123970; }
    .hint { color: #475a70; font-size: .9rem; }
    .section-matches { margin: .75rem 0 0; padding: 0; border: 0; }
    .section-matches legend { margin-bottom: .35rem; font-weight: 650; }
    .section-option { display: flex; align-items: center; gap: .65rem; padding: .6rem; border: 1px solid #d4dfeb; border-radius: .45rem; cursor: pointer; }
    .section-option input { width: auto; min-height: auto; margin: 0; }
    .error { color: #a71927; font-weight: 600; }
    .error:empty { display: none; }
    @media (max-width: 34rem) { main { margin-top: 1.25rem; } .fields { grid-template-columns: 1fr; } }
  </style>
</head>
<body data-section-search-url="{{ section_search_url }}">
  <main>
    <header>
      <h1>Création de compte client</h1>
      <p>{{ societe.nom }}</p>
    </header>

    <form class="card" id="client-form" method="post" action="{{ create_account_url }}">
      {% csrf_token %}
      <div class="fields">
        <div>
          <label for="first-name">Prénom</label>
          <input name="first_name" id="first-name" maxlength="150" pattern=".*\S.*" required>
        </div>
        <div>
          <label for="last-name">Nom</label>
          <input name="last_name" id="last-name" maxlength="150" pattern=".*\S.*" required>
        </div>
        <div class="wide">
          <label for="email">Adresse e-mail</label>
          <input name="email" id="email" type="email" maxlength="254" aria-describedby="email-error" required>
          <p id="email-error" class="error" role="alert"></p>
        </div>
        <div>
          <label for="country">Pays</label>
          <input name="pays" id="country" placeholder="Ex. France" autocomplete="off" maxlength="100" aria-describedby="country-error" required>
          <p id="country-error" class="error" role="alert"></p>
        </div>
        <div class="wide">
          <label for="section-code">Code de section</label>
          <input id="section-code" inputmode="numeric" pattern="\s*[0-9]+\s*" placeholder="Ex. 405" aria-controls="section-matches" aria-describedby="section-status" required>
          <p id="section-status" class="hint" role="status"></p>
          <fieldset id="section-matches" class="section-matches" hidden>
            <legend>Choisir la section exacte</legend>
            <div id="section-options"></div>
          </fieldset>
        </div>
      </div>
      <button type="submit">Créer le compte</button>
      <p id="creation-error" class="error" role="alert"></p>
    </form>

  </main>

  <script>
    const form = document.querySelector('#client-form');
    const emailInput = document.querySelector('#email');
    const emailError = document.querySelector('#email-error');
    const countryInput = document.querySelector('#country');
    const countryError = document.querySelector('#country-error');
    const sectionCode = document.querySelector('#section-code');
    const sectionStatus = document.querySelector('#section-status');
    const sectionMatches = document.querySelector('#section-matches');
    const sectionOptions = document.querySelector('#section-options');
    const creationError = document.querySelector('#creation-error');
    let sections = [];
    let sectionRequest;
    let sectionTimer;
    function updateSectionMatches() {
      clearTimeout(sectionTimer);
      if (sectionRequest) sectionRequest.abort();
      sections = [];
      const code = sectionCode.value.trim();
      sectionOptions.replaceChildren();
      sectionMatches.hidden = true;
      sectionCode.setCustomValidity('');
      sectionStatus.textContent = '';
      if (!code) return;
      if (!/^[0-9]{1,20}$/.test(code)) {
        sectionCode.setCustomValidity('Saisissez un code de section numérique.');
        sectionStatus.textContent = sectionCode.validationMessage;
        return;
      }
      sectionCode.setCustomValidity('Recherche des sections en cours.');
      sectionStatus.textContent = 'Recherche des sections…';
      const controller = new AbortController();
      sectionRequest = controller;
      sectionTimer = setTimeout(() => searchSections(code, controller), 250);
    }

    async function searchSections(code, controller) {
      try {
        const url = new URL(document.body.dataset.sectionSearchUrl, location.origin);
        url.searchParams.set('code', code);
        const response = await fetch(url, {
          credentials: 'same-origin',
          cache: 'no-store',
          signal: controller.signal,
        });
        const data = await response.json();
        if (controller.signal.aborted) return;
        if (!response.ok) throw new Error(data.error || 'Recherche indisponible.');
        sections = data.sections;
        sectionCode.setCustomValidity(sections.length ? '' : 'Aucune section trouvée pour ce code.');
        sectionStatus.textContent = sectionCode.validationMessage;
        sectionMatches.hidden = sections.length === 0;
        for (const section of sections) {
          const radio = document.createElement('input');
          radio.type = 'radio';
          radio.name = 'section';
          radio.value = section.id;
          radio.required = true;

          const label = document.createElement('label');
          label.className = 'section-option';
          label.append(radio, section.label);
          sectionOptions.append(label);
        }
      } catch (error) {
        if (controller.signal.aborted) return;
        sectionCode.setCustomValidity('La recherche des sections est indisponible.');
        sectionStatus.textContent = 'La recherche des sections est indisponible. Vérifiez votre connexion et reconnectez-vous si nécessaire.';
      }
    }

    emailInput.addEventListener('input', () => {
      emailError.textContent = '';
      emailInput.removeAttribute('aria-invalid');
    });
    countryInput.addEventListener('input', () => {
      countryError.textContent = '';
      countryInput.removeAttribute('aria-invalid');
    });
    sectionCode.addEventListener('input', updateSectionMatches);
    updateSectionMatches();

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const button = form.querySelector('button[type="submit"]');
      if (button.disabled) return;
      button.disabled = true;
      creationError.textContent = '';
      emailError.textContent = '';
      countryError.textContent = '';
      try {
        const response = await fetch(form.action, {
          method: 'POST',
          credentials: 'same-origin',
          body: new FormData(form),
        });
        const data = await response.json();
        if (!response.ok) {
          const errors = data.errors || {};
          if (errors.email) {
            emailError.textContent = errors.email.map((error) => error.message).join(' ');
            emailInput.setAttribute('aria-invalid', 'true');
          }
          if (errors.pays) {
            countryError.textContent = errors.pays.map((error) => error.message).join(' ');
            countryInput.setAttribute('aria-invalid', 'true');
          }
          creationError.textContent = data.error || Object.values(errors)
            .flat().map((error) => error.message).join(' ');
          return;
        }
        form.reset();
        updateSectionMatches();
        window.alert('Username : ' + data.username);
      } catch (error) {
        creationError.textContent = 'Impossible de confirmer la création. Vérifiez votre connexion et reconnectez-vous si nécessaire.';
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
